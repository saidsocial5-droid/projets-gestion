# Free daily scheduler for the email digest (works with any host: Netlify, Vercel…).
# Needs two repository secrets: APP_URL (e.g. https://afmi-projets.netlify.app) and CRON_SECRET.
# Because it queries the database every day, it also keeps a free Supabase project active.
name: Daily digest

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 07:00 in Morocco (06:00 during Ramadan)
  workflow_dispatch: {}

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the digest endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 --retry 3 --retry-delay 20 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/digest"
