# Free weekly database backup (the free Supabase plan has no backups).
# Needs two repository secrets:
#   SUPABASE_DB_URL   — Supabase > Connect > "Session pooler" connection string (with the DB password)
#   BACKUP_PASSPHRASE — a long password; backups are encrypted with it (keep it somewhere safe)
# The encrypted dump is kept 90 days as a workflow artifact, visible only to repository members.
# Restore: gpg -d backup.sql.gz.gpg | gunzip | psql "<connection string>"
name: Weekly backup

on:
  schedule:
    - cron: "30 2 * * 0" # Sundays 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump, compress and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "SUPABASE_DB_URL or BACKUP_PASSPHRASE secret is not set; skipping."
            exit 0
          fi
          set -o pipefail
          # same major version as Supabase Postgres (17)
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL" --no-owner --no-privileges --schema=public --schema=auth --schema=storage' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gz.gpg
          ls -lh backup.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 90
          if-no-files-found: ignore
